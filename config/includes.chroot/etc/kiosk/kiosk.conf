# kisok-os configuration.
# Edit this file (or override it after install) to change kiosk behaviour.

# The page the kiosk opens on boot.
KIOSK_URL="https://www.youtube.com"

# Whether to disable Chromium's GPU acceleration.
#   auto = disable automatically inside a virtual machine (recommended)
#   yes  = always disable (use if you see a black browser window)
#   no   = always keep GPU acceleration (best on real hardware with drivers)
KIOSK_DISABLE_GPU="auto"

# How many seconds to show the welcome screen before the browser opens.
WELCOME_SECONDS=4
